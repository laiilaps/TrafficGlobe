# Live-Globus : rein statische Dateien plus eine JSON-Datei. Kein Backend, keine Schreibrechte.
#   /usr/share/nginx/globe-web   <- ./web        (ro)  Frontend
#   /usr/share/nginx/globe-data  <- ./out/public (ro)  nur live-public.json

# Rate-Limit pro echtem Besucher. Die gemeinsame Zone "general" taugt hier nicht: Hinter dem Tunnel sieht nginx für
# alle Besucher dieselbe Adresse, das Limit wäre also ein gemeinsamer Topf für die ganze Welt.
limit_req_zone $http_cf_connecting_ip zone=globe:10m rate=5r/s;

server {
    listen 80;
    server_name example.com;   # deine Domain

    root /usr/share/nginx/globe-web;
    index index.html;
    autoindex off;

    limit_req zone=globe burst=60 nodelay;
    limit_req_status 429;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/geo+json;

    # Nur diese eine Datei aus dem Datenverzeichnis, sonst nichts
    location = /data/live-public.json {
        alias /usr/share/nginx/globe-data/live-public.json;
        default_type application/json;
        include /etc/nginx/snippets/globe-headers.conf;
        add_header Cache-Control "no-store, no-transform" always;
    }
    location ^~ /data/ { return 404; }

    location ~ /\. { return 404; }

    location = /countries.geojson {
        default_type application/geo+json;
        include /etc/nginx/snippets/globe-headers.conf;
        add_header Cache-Control "public, max-age=86400, no-transform" always;
    }


    location ^~ /vendor/ {
        include /etc/nginx/snippets/globe-headers.conf;
        add_header Cache-Control "public, max-age=86400, no-transform" always;
    }

    location / {
        include /etc/nginx/snippets/globe-headers.conf;
        add_header Cache-Control "no-cache, no-transform" always;
        try_files $uri $uri/ $uri.html =404;
    }
}
